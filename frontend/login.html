<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPG Media — Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-wrap {
      width: 100%;
      max-width: 400px;
      margin: 4rem auto 0;
    }
    .login-wrap h1 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 0.25rem;
      font-size: 1.6rem;
    }
    .login-wrap p.sub {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .field label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .field input {
      background: #0f3460;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-size: 1rem;
      width: 100%;
      transition: border-color 0.15s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
    }
    #btn-login {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    #error-msg {
      color: var(--accent);
      font-size: 0.88rem;
      text-align: center;
      min-height: 1.2em;
      margin-top: 0.75rem;
    }
    .plex-note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <h1>⚔ RPG Media</h1>
    <p class="sub">Sign in with your Plex account</p>

    <div class="card">
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">Plex username or email</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </div>
        <button id="btn-login" type="submit">Sign in</button>
        <p id="error-msg"></p>
      </form>
    </div>

    <p class="plex-note">
      Your credentials are sent only to your local backend.<br/>
      The Plex token is stored server-side and never sent to the browser.
    </p>
  </div>

  <script>
    const BACKEND = `http://${window.location.hostname}:8000`;

    // If already authenticated, redirect to main app
    fetch(`${BACKEND}/api/auth/status`, { credentials: "include" })
      .then(r => r.json())
      .then(d => { if (d.authenticated) location.replace("index.html"); })
      .catch(() => {});

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login");
      const errEl = document.getElementById("error-msg");
      errEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing in…";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const resp = await fetch(`${BACKEND}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, password }),
        });

        if (resp.ok) {
          location.replace("index.html");
        } else {
          const data = await resp.json().catch(() => ({}));
          errEl.textContent = data.detail || "Login failed. Check your credentials.";
        }
      } catch (err) {
        errEl.textContent = "Could not reach the backend. Is it running?";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
